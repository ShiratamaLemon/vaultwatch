version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - corepack enable
        - corepack prepare pnpm@latest --activate
        - pnpm install --force
    build:
      commands:
        - pnpm build
        - echo "=== Build output breakdown ==="
        - du -sh .next/
        - du -sh .next/*/ 2>/dev/null || true
        - du -sh .next/server/*/ 2>/dev/null || true
        - rm -rf .next/cache
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
